name: Odoo addon tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  afa-addons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OCA bank-payment addons
        uses: actions/checkout@v4
        with:
          repository: OCA/bank-payment
          ref: fdd5d4040b235a4c688b2aec30611d57dd246b64
          path: .oca-bank-payment
      - name: Fetch pinned OCA account-reconcile addons
        uses: actions/checkout@v4
        with:
          repository: OCA/account-reconcile
          ref: 8fc48a4beff3203241c0f61c4d3bc15631f75a4d
          path: .oca-account-reconcile
      - name: Check Compose configuration
        run: docker compose -f compose.test.yaml config -q
      - name: Run demo-compatible addon tests
        run: |
          set -o pipefail
          docker compose -f compose.test.yaml run --rm -e AFA_EXPECT_DEMO=1 odoo -d afa_addons_demo_ci -i afa_family,afa_account_reconcile,afa_membership,afa_member_pricing,afa_apparel_shop,afa_sepa,afa_service_subscription,afa_school_course,afa_extracurricular,afa_family_import,afa_acollida --with-demo --test-enable --test-tags /afa_family,/afa_account_reconcile,/afa_member_pricing,/afa_apparel_shop,/afa_service_subscription,/afa_school_course,/afa_extracurricular:TestExtracurricularDemo,/afa_family_import --stop-after-init --log-level=test --db_host=db --db_user=odoo 2>&1 | python3 -c '
          import re
          import sys

          output = sys.stdin.read()
          print(output, end="")
          summaries = re.findall(
              r"odoo\.tests\.result: (\d+) failed, (\d+) error\(s\) of (\d+) tests when loading database",
              output,
          )
          passed = bool(summaries) and all(
              failures == "0" and errors == "0" and int(count) > 0
              for failures, errors, count in summaries
          )
          demo_loaded = (
              "loading afa_family/demo/family_demo.xml" in output
              and "loading afa_member_pricing/demo/apparel_demo.xml" in output
              and "loading afa_extracurricular/demo/extracurricular_demo.xml" in output
          )
          test_markers_ran = all(
              marker in output
              for marker in (
                  "Starting TestFamilyDemo.test_demo_families_and_contacts",
                  "Starting TestPartnerEligibility.test_bank_statement_partner_selectors_filter_ineligible_family_members",
                  "Starting TestMemberPricing.test_payment_gate_rejects_stale_member_cart_without_writing",
                  "Starting TestMemberPricingDemo.test_demo_apparel_variants_and_prices",
                  "Starting TestMemberPricingWebsite.test_identified_member_product_page_uses_member_price",
                  "Starting TestAfaApparelStockReservation.test_wire_transfer_reserves_stock_for_seven_days",
                  "Starting TestAfaApparelDemo.test_demo_apparel_variants_are_stock_tracked_and_blocked_when_empty",
                  "Starting TestServiceSubscription.test_family_invoice_aggregates_services_and_does_not_duplicate",
                  "Starting TestSchoolPromotion.test_withdraws_services_before_archiving",
                  "Starting TestExtracurricularDemo.test_demo_activity_has_a_current_canceled_session_and_enrollment",
                  "Starting TestFamilyImport.test_import_creates_family_guardians_students_bank_and_mandate",
              )
          )
          sys.exit(0 if passed and demo_loaded and test_markers_ran else 1)
          '

      - name: Preinstall website product defaults for isolated tests
        run: |
          docker compose -f compose.test.yaml run --rm odoo -d afa_addons_isolated_tests_ci -i website_sale --stop-after-init --log-level=warn --db_host=db --db_user=odoo --db_password=odoo

      - name: Run period and billing tests without demo fixtures
        run: |
          set -o pipefail
          docker compose -f compose.test.yaml run --rm odoo -d afa_addons_isolated_tests_ci -i afa_family,afa_account_reconcile,afa_membership,afa_member_pricing,afa_apparel_shop,afa_sepa,afa_service_subscription,afa_school_course,afa_extracurricular,afa_family_import,afa_acollida --test-enable --test-tags /afa_membership,/afa_sepa,/afa_extracurricular,/afa_acollida --stop-after-init --log-level=test --db_host=db --db_user=odoo 2>&1 | python3 -c '
          import re
          import sys

          output = sys.stdin.read()
          print(output, end="")
          summaries = re.findall(
              r"odoo\.tests\.result: (\d+) failed, (\d+) error\(s\) of (\d+) tests when loading database",
              output,
          )
          passed = bool(summaries) and all(
              failures == "0" and errors == "0" and int(count) > 0
              for failures, errors, count in summaries
          )
          test_markers_ran = all(
              marker in output
              for marker in (
                  "Starting TestMembershipDomain.test_school_year_bounds_include_july_first_and_june_thirtieth",
                  "Starting TestMembershipInvoice.test_posted_invoice_requires_full_payment_and_period_bounds",
                  "Starting TestMembershipIntent.test_contact_membership_column_projects_effective_family_status",
                  "Starting TestAfaSepa.test_xml_duplicate_and_return",
                  "Starting TestExtracurricular.test_billing_covers_only_activity_months_with_tariffs_and_no_duplicates",
                  "Starting TestAcollida.test_imported_charges_generate_one_family_invoice_with_month_amounts",
              )
          )
          sys.exit(0 if passed and test_markers_ran else 1)
          '

      - name: Verify current-month demo billing preview
        run: |
          set -euo pipefail
          {
            cat deploy/preview/prepare_preview.py
            printf '\nprepare_preview(env)\n'
          } | docker compose -f compose.test.yaml run --rm -T odoo odoo shell \
            -d afa_addons_demo_ci --db_host=db --db_user=odoo --db_password=odoo
