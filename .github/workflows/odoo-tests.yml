name: Odoo addon tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  afa-addons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OCA bank-payment addons
        uses: actions/checkout@v4
        with:
          repository: OCA/bank-payment
          ref: fdd5d4040b235a4c688b2aec30611d57dd246b64
          path: .oca-bank-payment
      - name: Check Compose configuration
        run: docker compose -f compose.test.yaml config -q
      - name: Install AFA addons with demo and run focused tests
        run: |
          set -o pipefail
          docker compose -f compose.test.yaml run --rm -e AFA_EXPECT_DEMO=1 odoo -d afa_addons_demo_ci -i afa_family,afa_membership,afa_member_pricing,afa_sepa,afa_service_subscription,afa_school_course --with-demo --test-enable --test-tags /afa_family,/afa_membership,/afa_member_pricing,/afa_sepa,/afa_service_subscription,/afa_school_course --stop-after-init --log-level=test --db_host=db --db_user=odoo 2>&1 | python3 -c '
          import re
          import sys

          output = sys.stdin.read()
          print(output, end="")
          summaries = re.findall(
              r"odoo\.tests\.result: (\d+) failed, (\d+) error\(s\) of (\d+) tests when loading database",
              output,
          )
          passed = bool(summaries) and all(
              failures == "0" and errors == "0" and int(count) > 0
              for failures, errors, count in summaries
          )
          demo_loaded = "loading afa_family/demo/family_demo.xml" in output
          demo_test_ran = "Starting TestFamilyDemo.test_demo_families_and_contacts" in output
          membership_tests_ran = all(
              marker in output
              for marker in (
                  "Starting TestMembershipDomain.test_school_year_bounds_include_july_first_and_june_thirtieth",
                  "Starting TestMembershipInvoice.test_posted_invoice_requires_full_payment_and_period_bounds",
                  "Starting TestMembershipSettings.test_manual_mode_persists_through_july_and_mode_switch",
              )
          )
          pricing_tests_ran = "Starting TestMemberPricing.test_payment_gate_rejects_stale_member_cart_without_writing" in output
          pricing_demo_ran = (
              "loading afa_member_pricing/demo/apparel_demo.xml" in output
              and "Starting TestMemberPricingDemo.test_demo_apparel_variants_and_prices" in output
              and "Starting TestMemberPricingWebsite.test_identified_member_product_page_uses_member_price" in output
          )
          sepa_tests_ran = "Starting TestAfaSepa.test_xml_duplicate_and_return" in output
          service_tests_ran = "Starting TestServiceSubscription.test_family_invoice_aggregates_services_and_does_not_duplicate" in output
          school_tests_ran = "Starting TestSchoolPromotion.test_withdraws_services_before_archiving" in output
          sys.exit(0 if passed and demo_loaded and demo_test_ran and membership_tests_ran and pricing_tests_ran and pricing_demo_ran and sepa_tests_ran and service_tests_ran and school_tests_ran else 1)
          '
