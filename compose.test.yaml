services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:8079:8069"
    volumes:
      - ./afa_account_reconcile:/mnt/extra-addons/afa_account_reconcile:ro
      - ./afa_family:/mnt/extra-addons/afa_family:ro
      - ./afa_membership:/mnt/extra-addons/afa_membership:ro
      - ./afa_member_pricing:/mnt/extra-addons/afa_member_pricing:ro
      - ./afa_apparel_shop:/mnt/extra-addons/afa_apparel_shop:ro
      - ./afa_sepa:/mnt/extra-addons/afa_sepa:ro
      - ./afa_invoice_receipt:/mnt/extra-addons/afa_invoice_receipt:ro
      - ./afa_service_subscription:/mnt/extra-addons/afa_service_subscription:ro
      - ./afa_school_course:/mnt/extra-addons/afa_school_course:ro
      - ./afa_extracurricular:/mnt/extra-addons/afa_extracurricular:ro
      - ./afa_family_import:/mnt/extra-addons/afa_family_import:ro
      - ./afa_acollida:/mnt/extra-addons/afa_acollida:ro
      - ./afa_attendance_kiosk_pwa:/mnt/extra-addons/afa_attendance_kiosk_pwa:ro
      - ./.oca-bank-payment/account_payment_mode:/mnt/extra-addons/account_payment_mode:ro
      - ./.oca-bank-payment/account_payment_order:/mnt/extra-addons/account_payment_order:ro
      - ./.oca-bank-payment/account_banking_pain_base:/mnt/extra-addons/account_banking_pain_base:ro
      - ./.oca-bank-payment/account_banking_mandate:/mnt/extra-addons/account_banking_mandate:ro
      - ./.oca-bank-payment/account_banking_sepa_direct_debit:/mnt/extra-addons/account_banking_sepa_direct_debit:ro
      - ./.oca-account-reconcile/account_reconcile_oca:/mnt/extra-addons/account_reconcile_oca:ro
      - ./.oca-account-reconcile/account_statement_base:/mnt/extra-addons/account_statement_base:ro
      - ./.oca-l10n-spain/l10n_es_account_statement_import_n43:/mnt/extra-addons/l10n_es_account_statement_import_n43:ro
      - ./.oca-bank-statement-import/account_statement_import_base:/mnt/extra-addons/account_statement_import_base:ro
      - ./.oca-bank-statement-import/account_statement_import_file:/mnt/extra-addons/account_statement_import_file:ro
      - ./.oca-bank-statement-import/account_statement_import_sheet_file:/mnt/extra-addons/account_statement_import_sheet_file:ro
      - ./.oca-bank-statement-import/account_statement_import_sheet_file_xls:/mnt/extra-addons/account_statement_import_sheet_file_xls:ro
      - ./.oca-bank-statement-import/account_statement_import_sheet_file_xlsx:/mnt/extra-addons/account_statement_import_sheet_file_xlsx:ro
      - odoo_test_data:/var/lib/odoo

volumes:
  postgres_test_data:
  odoo_test_data:
