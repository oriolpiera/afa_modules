services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:8079:8069"
    volumes:
      - ./afa_family:/mnt/extra-addons/afa_family:ro
      - ./afa_membership:/mnt/extra-addons/afa_membership:ro
      - ./afa_member_pricing:/mnt/extra-addons/afa_member_pricing:ro
      - ./afa_sepa:/mnt/extra-addons/afa_sepa:ro
      - ./afa_service_subscription:/mnt/extra-addons/afa_service_subscription:ro
      - ./.oca-bank-payment/account_payment_mode:/mnt/extra-addons/account_payment_mode:ro
      - ./.oca-bank-payment/account_payment_order:/mnt/extra-addons/account_payment_order:ro
      - ./.oca-bank-payment/account_banking_pain_base:/mnt/extra-addons/account_banking_pain_base:ro
      - ./.oca-bank-payment/account_banking_mandate:/mnt/extra-addons/account_banking_mandate:ro
      - ./.oca-bank-payment/account_banking_sepa_direct_debit:/mnt/extra-addons/account_banking_sepa_direct_debit:ro
      - odoo_test_data:/var/lib/odoo

volumes:
  postgres_test_data:
  odoo_test_data:
